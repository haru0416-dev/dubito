schema: dubito.problem/v1
id: furniture-workshop-v1
class: milp
sense: max
# Variable names are the exchange interface.
# The verification block is consumed only by Z3 / the residual checker.
# Solver formulation modules must not import this file.
variables:
  tables:
    kind: integer
    lower: 0
  chairs:
    kind: integer
    lower: 0
narrative: |
  A small workshop makes tables and chairs.
  One table uses 3 wood and 2 labor, profit 50.
  One chair uses 1 wood and 1 labor, profit 20.
  Stock: 12 wood, 10 labor.
  At least two chairs must be produced for every table.
  Quantities are non-negative integers. Maximize profit.
tolerances:
  primal_feasibility: 1.0e-6
  objective_abs: 1.0e-6
  objective_rel: 1.0e-6
  integrality: 1.0e-8
verification:
  constraints:
    - name: wood
      terms: {tables: 3, chairs: 1}
      op: "<="
      rhs: 12
    - name: labor
      terms: {tables: 2, chairs: 1}
      op: "<="
      rhs: 10
    - name: mix
      terms: {chairs: 1, tables: -2}
      op: ">="
      rhs: 0
  objective:
    terms: {tables: 50, chairs: 20}
